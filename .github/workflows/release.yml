name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-deb:
    name: Build Debian package (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build -ldflags="-s -w -X github.com/stefanamaerz/osquery_exporter/version.Version=${GITHUB_REF_NAME}" -o osquery_exporter .

      - name: Build .deb package
        id: deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKGDIR="osquery-exporter_${VERSION}_${{ matrix.arch }}"
          mkdir -p "${PKGDIR}/usr/bin"
          mkdir -p "${PKGDIR}/usr/share/doc/osquery-exporter"
          mkdir -p "${PKGDIR}/DEBIAN"
          cp osquery_exporter "${PKGDIR}/usr/bin/"
          cp README.md "${PKGDIR}/usr/share/doc/osquery-exporter/"
          cat > "${PKGDIR}/DEBIAN/control" <<CONTROL
          Package: osquery-exporter
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: ${{ matrix.arch }}
          Depends: osquery
          Maintainer: Stefan Maerz <104440170+stefanamaerz@users.noreply.github.com>
          Description: Prometheus exporter for osquery query results
           osquery_exporter runs osqueryi queries on each Prometheus scrape
           and exposes the results as Prometheus metrics.
          CONTROL
          cat > "${PKGDIR}/usr/share/doc/osquery-exporter/changelog" <<CHANGELOG
          osquery-exporter (${VERSION}) unstable; urgency=medium

            * Release ${VERSION}

           -- Stefan Maerz <104440170+stefanamaerz@users.noreply.github.com>  $(date -R)
          CHANGELOG
          dpkg-deb --build "${PKGDIR}"
          echo "deb_file=${PKGDIR}.deb" >> "$GITHUB_OUTPUT"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osquery-exporter-deb-${{ matrix.arch }}
          path: ${{ steps.deb.outputs.deb_file }}
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-deb
    steps:
      - name: Download amd64 .deb
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: osquery-exporter-deb-amd64
          path: artifacts

      - name: Download arm64 .deb
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: osquery-exporter-deb-arm64
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/*.deb
