name: Build .deb

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types: [created, published]

jobs:
  build-deb:
    name: Build Debian package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w" -o osquery_exporter .

      - name: Install nFPM
        env:
          NFPM_VERSION: '2.42.0'
        run: |
          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@v${NFPM_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build .deb package
        id: deb
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.0-{0}', github.sha) }}
        run: |
          VERSION="${VERSION#v}"
          echo "building version ${VERSION}"

          mkdir -p dist

          printf 'osquery_exporter (%s) unstable; urgency=medium\n\n  * Release %s\n\n -- Stefan Maerz <104440170+stefanamaerz@users.noreply.github.com>  %s\n' \
            "${VERSION}" "${VERSION}" "$(date -R)" > changelog.Debian

          nfpm package --config .nfpm.yaml --packager deb --target dist/

          deb_file=$(ls dist/*.deb | head -n 1)
          echo "deb_file=${deb_file}" >> "$GITHUB_OUTPUT"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osquery-exporter-deb
          path: ${{ steps.deb.outputs.deb_file }}
          retention-days: 30

      - name: Upload .deb to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" "${{ steps.deb.outputs.deb_file }}" --clobber
