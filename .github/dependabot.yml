version: 2
updates:
  # Disable automatic version updates to avoid noise
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

    # open-pull-requests-limit: 0 means that Dependabot will not create PRs for
    # regular updates, but will still create PRs for security updates. This helps
    # to reduce noise while ensuring that critical security updates are not missed.
    # https://docs.github.com/en/code-security/supply-chain-security/understanding-dependabot/dependabot-options-reference#open-pull-requests-limit-
    # and https://stackoverflow.com/questions/64047526/how-to-get-dependabot-to-trigger-for-security-updates-only
    open-pull-requests-limit: 0  # No PRs for regular updates

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns:
          - "*"
