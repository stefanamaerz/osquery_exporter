---
# Example macOS config for testing against a Fleet/orbit-managed osqueryd binary.
# This assumes there is a wrapper script on PATH named "osqueryi" that forwards
# to your local osqueryd with the necessary unprivileged flags.
#
# Example wrapper (save as an executable on your PATH, e.g. ~/.local/bin/osqueryi):
#   #!/bin/sh
#   DB=$(mktemp -d /tmp/osquery_exporter.XXXXXX)
#   trap 'rm -rf "$DB"' EXIT
#   exec /opt/orbit/bin/osqueryd/macos-app/stable/osquery.app/Contents/MacOS/osqueryd \
#     --pidfile="$DB/osquery.pid" \
#     --database_path="$DB/osquery.db" \
#     --extensions_socket="$DB/osquery.em" \
#     --logger_plugin=stderr \
#     --disable_logging=true \
#     --disable_extensions \
#     --ephemeral \
#     --S "$@"

runtime:
  osquery: "osqueryi"
  timeout: 15s

metrics:
  counters:
    - name: history_lines_count
      help: "number of entries in the history"
      query: "select count(*) as count from shell_history"
      valueidentifier: count
  countervecs:
    - name: last_users_count
      help: "number of last logins by username and tty"
      query: "select username, tty, count(*) as count from last where username != '' group by username, tty"
      valueidentifier: count
      labelidentifier:
        - username
        - tty
  gauges:
    - name: block_devices
      help: "number of block devices which are not partitions"
      query: "select count(*) as count from block_devices where parent = ''"
      valueidentifier: count
    - name: crontab_entries
      help: "number of entries in the crontab"
      query: "select count(*) as count from crontab"
      valueidentifier: count
  gaugevecs:
    - name: users_by_shell
      help: "number of users by login shell"
      query: "select count(*) as count, shell from users group by shell"
      valueidentifier: count
      labelidentifier:
        - shell
