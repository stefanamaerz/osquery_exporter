# Example osquery_exporter configuration that exposes osquery's built-in
# introspection tables as Prometheus metrics.
#
# These queries read from osquery_schedule, osquery_events, osquery_packs,
# osquery_info, osquery_extensions, etc. No special osquery flags are required;
# the tables are available whenever an osqueryd extension socket is active.

runtime:
  socket_path: "/var/run/osquery/osquery.em"
  timeout: 10s

queries:
  - name: osquery-schedule
    query: |
      SELECT
        name,
        executions,
        output_size,
        (wall_time_ms / 1000.0) AS wall_time_seconds,
        (user_time / 1000.0) AS user_time_seconds,
        (system_time / 1000.0) AS system_time_seconds,
        (last_wall_time_ms / 1000.0) AS last_wall_time_seconds,
        (last_user_time / 1000.0) AS last_user_time_seconds,
        (last_system_time / 1000.0) AS last_system_time_seconds,
        average_memory,
        last_memory,
        denylisted,
        last_executed,
        interval
      FROM osquery_schedule

  - name: osquery-events
    query: |
      SELECT
        name,
        events,
        refreshes,
        subscriptions,
        active
      FROM osquery_events

  - name: osquery-events-publishers
    query: |
      SELECT
        name,
        refreshes
      FROM osquery_events
      WHERE type = 'publisher'

  - name: osquery-packs
    query: |
      SELECT
        name,
        discovery_executions,
        discovery_cache_hits,
        active
      FROM osquery_packs

  - name: osquery-extensions
    query: |
      SELECT
        1 AS value,
        uuid,
        name,
        version,
        sdk_version
      FROM osquery_extensions

  - name: osquery-info
    query: |
      SELECT
        start_time,
        config_valid,
        CASE WHEN extensions = 'active' THEN 1 ELSE 0 END AS extensions_active,
        version,
        build_platform,
        build_distro
      FROM osquery_info

metrics:
  countervecs:
    # osquery_schedule — per-query execution and resource accounting
    - name: osquery_query_executions_total
      help: Cumulative executions of each scheduled query since osqueryd start.
      queryref: osquery-schedule
      valueidentifier: executions
      labelidentifier:
        - name

    - name: osquery_query_output_size_bytes_total
      help: Cumulative result bytes generated by each scheduled query.
      queryref: osquery-schedule
      valueidentifier: output_size
      labelidentifier:
        - name

    - name: osquery_query_wall_time_seconds_total
      help: Cumulative wall-clock time spent executing each scheduled query.
      queryref: osquery-schedule
      valueidentifier: wall_time_seconds
      labelidentifier:
        - name

    - name: osquery_query_user_time_seconds_total
      help: Cumulative user CPU time spent executing each scheduled query.
      queryref: osquery-schedule
      valueidentifier: user_time_seconds
      labelidentifier:
        - name

    - name: osquery_query_system_time_seconds_total
      help: Cumulative system CPU time spent executing each scheduled query.
      queryref: osquery-schedule
      valueidentifier: system_time_seconds
      labelidentifier:
        - name

    # osquery_events — event publisher/subscriber health
    - name: osquery_events_emitted_total
      help: Cumulative events emitted by each publisher or subscriber.
      queryref: osquery-events
      valueidentifier: events
      labelidentifier:
        - name

    - name: osquery_events_refreshes_total
      help: Cumulative publisher refreshes.
      queryref: osquery-events-publishers
      valueidentifier: refreshes
      labelidentifier:
        - name

    # osquery_packs — query pack execution accounting
    - name: osquery_pack_discovery_executions_total
      help: Cumulative discovery query executions for each pack.
      queryref: osquery-packs
      valueidentifier: discovery_executions
      labelidentifier:
        - name

    - name: osquery_pack_discovery_cache_hits_total
      help: Cumulative discovery query cache hits for each pack.
      queryref: osquery-packs
      valueidentifier: discovery_cache_hits
      labelidentifier:
        - name

  gaugevecs:
    # osquery_schedule — per-query execution and resource accounting
    - name: osquery_query_last_wall_time_seconds
      help: Wall-clock time of the most recent execution of each scheduled query.
      queryref: osquery-schedule
      valueidentifier: last_wall_time_seconds
      labelidentifier:
        - name

    - name: osquery_query_last_user_time_seconds
      help: User CPU time of the most recent execution of each scheduled query.
      queryref: osquery-schedule
      valueidentifier: last_user_time_seconds
      labelidentifier:
        - name

    - name: osquery_query_last_system_time_seconds
      help: System CPU time of the most recent execution of each scheduled query.
      queryref: osquery-schedule
      valueidentifier: last_system_time_seconds
      labelidentifier:
        - name

    - name: osquery_query_average_memory_bytes
      help: Average resident memory left allocated by each scheduled query.
      queryref: osquery-schedule
      valueidentifier: average_memory
      labelidentifier:
        - name

    - name: osquery_query_last_memory_bytes
      help: Resident memory left allocated by the last execution of each scheduled query.
      queryref: osquery-schedule
      valueidentifier: last_memory
      labelidentifier:
        - name

    - name: osquery_query_denylisted
      help: 1 if the watchdog denied/blacklisted the scheduled query.
      queryref: osquery-schedule
      valueidentifier: denylisted
      labelidentifier:
        - name

    - name: osquery_query_last_executed_timestamp
      help: UNIX timestamp of the last execution of each scheduled query.
      queryref: osquery-schedule
      valueidentifier: last_executed
      labelidentifier:
        - name

    - name: osquery_query_interval_seconds
      help: Configured execution interval for each scheduled query.
      queryref: osquery-schedule
      valueidentifier: interval
      labelidentifier:
        - name

    # osquery_events — event publisher/subscriber health
    - name: osquery_events_subscriptions
      help: Number of subscriptions for each publisher or subscriber.
      queryref: osquery-events
      valueidentifier: subscriptions
      labelidentifier:
        - name

    - name: osquery_events_active
      help: 1 if the event publisher/subscriber is active.
      queryref: osquery-events
      valueidentifier: active
      labelidentifier:
        - name

    # osquery_packs — query pack execution accounting
    - name: osquery_pack_active
      help: 1 if the pack is currently active on this host.
      queryref: osquery-packs
      valueidentifier: active
      labelidentifier:
        - name

    # osquery_extensions — loaded extensions
    - name: osquery_extension_info
      help: Constant 1 labeled with each loaded extension's metadata.
      queryref: osquery-extensions
      valueidentifier: value
      labelidentifier:
        - uuid
        - name
        - version
        - sdk_version

  gauges:
    # osquery_info — single-row process identity and health
    - name: osquery_info
      help: Constant 1 labeled with osquery version, build platform, and build distro.
      queryref: osquery-info
      valueidentifier: extensions_active
      labelidentifier:
        - version
        - build_platform
        - build_distro

    - name: osquery_start_time_seconds
      help: UNIX timestamp when osqueryd started.
      queryref: osquery-info
      valueidentifier: start_time

    - name: osquery_config_valid
      help: 1 if the current osquery configuration is valid.
      queryref: osquery-info
      valueidentifier: config_valid

    - name: osquery_extensions_active
      help: 1 if osquery extensions are active.
      queryref: osquery-info
      valueidentifier: extensions_active
